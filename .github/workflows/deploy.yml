# 部署到 GitHub Pages
# 觸發：push 到 main 分支，或在 Actions 頁面手動觸發
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只跑一個部署，新的 push 進來就取消還在跑的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 建置（含正式環境的 RSVP endpoint）
        run: npm run build
        env:
          VITE_RSVP_ENDPOINT: ${{ secrets.VITE_RSVP_ENDPOINT }}

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 build 產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
